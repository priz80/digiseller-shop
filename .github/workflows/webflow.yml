name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          DIGISELLER_AGENT_ID: ${{ secrets.DIGISELLER_AGENT_ID }}
          NEXT_PUBLIC_YM_ID: ${{ secrets.NEXT_PUBLIC_YM_ID }}

      - name: Validate deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.HOST }}
          DEPLOY_USERNAME: ${{ secrets.USERNAME }}
          DEPLOY_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_KEY: ${{ secrets.SSH_KEY }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USERNAME"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_KEY"

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          command_timeout: 20m
          script: |
            set -e
            cd /var/www/digital_stor_usr/data/www/digital-store.online
            git config --global --add safe.directory "$PWD"

            if [ ! -d .git ]; then
              git init -b main
              git remote add origin https://github.com/priz80/digiseller-shop.git
              git fetch --depth 1 origin main
              git reset --hard FETCH_HEAD
            else
              git fetch origin main
              git reset --hard FETCH_HEAD
            fi

            export DIGISELLER_AGENT_ID="${{ secrets.DIGISELLER_AGENT_ID }}"
            export NEXT_PUBLIC_YM_ID="${{ secrets.NEXT_PUBLIC_YM_ID }}"

            npm ci
            npm run build

            if command -v pm2 >/dev/null 2>&1; then
              pm2 delete digiseller-shop >/dev/null 2>&1 || true
              pm2 start npm --name digiseller-shop -- run start
              pm2 save
            else
              nohup npm run start >/tmp/digiseller-shop.log 2>&1 &
            fi
