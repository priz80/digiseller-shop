name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          DIGISELLER_AGENT_ID: ${{ secrets.DIGISELLER_AGENT_ID }}
          NEXT_PUBLIC_YM_ID: ${{ secrets.NEXT_PUBLIC_YM_ID }}

      - name: Validate deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.HOST }}
          DEPLOY_USERNAME: ${{ secrets.USERNAME }}
          DEPLOY_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_KEY: ${{ secrets.SSH_KEY }}
        run: |
          test -n "$DEPLOY_HOST" || (echo "Missing GitHub secret: HOST" && exit 1)
          test -n "$DEPLOY_USERNAME" || (echo "Missing GitHub secret: USERNAME" && exit 1)
          test -n "$DEPLOY_PORT" || (echo "Missing GitHub secret: SSH_PORT" && exit 1)
          test -n "$DEPLOY_KEY" || (echo "Missing GitHub secret: SSH_KEY" && exit 1)

      - name: Validate SSH private key
        env:
          DEPLOY_KEY: ${{ secrets.SSH_KEY }}
        run: |
          printf '%s' "$DEPLOY_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          if ! grep -q 'PRIVATE KEY' /tmp/deploy_key; then
            echo "SSH_KEY is not a private key. Do not store a .pub key or public key content."
            exit 1
          fi

          if ! ssh-keygen -l -f /tmp/deploy_key >/dev/null 2>&1; then
            echo "SSH_KEY is not in a format supported by OpenSSH. Re-export a valid private key."
            exit 1
          fi

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 20m
          script: |
            set -e
            cd /var/www/digital_stor_usr/data/www/digital-store.online
            git fetch origin
            git reset --hard origin/main
            npm ci
            npm run build

            if command -v pm2 >/dev/null 2>&1; then
              if pm2 describe digital-store >/dev/null 2>&1; then
                pm2 reload digital-store --update-env
              elif pm2 describe digiseller-shop >/dev/null 2>&1; then
                pm2 reload digiseller-shop --update-env
              else
                echo "PM2 is installed, but process names digital-store/digiseller-shop were not found"
                exit 1
              fi
            else
              echo "PM2 is not installed. Code and build were updated, but the running Next.js process was not restarted"
            fi